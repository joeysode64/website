name: Minimize and Deploy

on:
  push:
    branches: [main]
    paths: ["src/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version: stable

    - name: Install Minimizer
      run: go install github.com/tdewolff/minify/v2/cmd/minify@latest

    - name: Minify Source
      run: minify -r -s -o docs/ src/

    - uses: actions/upload-pages-artifact@v4
      with:
        path: docs

    - id: deployment
      uses: actions/deploy-pages@v4
